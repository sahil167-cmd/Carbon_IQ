version: '3.9'

services:
  mongodb:
    image: mongo:7.0
    container_name: carbon_os_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: carbon_os
      MONGO_INITDB_ROOT_PASSWORD: carbon_os_dev_password
      MONGO_INITDB_DATABASE: carbon_os_dev
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    container_name: carbon_os_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: carbon_os
      POSTGRES_PASSWORD: carbon_os_dev_password
      POSTGRES_DB: carbon_os_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carbon_os -d carbon_os_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: carbon_os_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: carbon_os_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: carbon_os_minio
      MINIO_ROOT_PASSWORD: carbon_os_minio_dev
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    command: server /data --console-address ':9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  mongodb_data:
  postgres_data:
  redis_data:
  minio_data:
