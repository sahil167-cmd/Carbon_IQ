packages:
  - 'apps/*'
  - 'packages/*'
  - 'shipmind-ai'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - 'bcrypt'
  - 'msgpackr-extract'
  - 'prisma'
  - 'protobufjs'
