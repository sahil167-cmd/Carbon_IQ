services:
  # 1. Node.js Core API Web Service (Free Tier)
  - type: web
    name: carbon-iq-core-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install && pnpm db:generate && pnpm --filter @carbon-iq/core-api build
    startCommand: node apps/core-api/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"

  # 2. Python FastAPI ML Service (Free Tier)
  - type: web
    name: carbon-iq-ml-service
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r apps/ml-service/requirements.txt
    startCommand: cd apps/ml-service && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
