services:
  # 1. Node.js Core API Web Service (Free Tier)
  - type: web
    name: carbon-iq-core-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install && pnpm --filter @carbon-iq/shared-types build && pnpm --filter @carbon-os/db generate && pnpm --filter @carbon-iq/core-api build
    startCommand: node apps/core-api/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: LLM_BASE_URL
        value: "https://generativelanguage.googleapis.com/v1beta/openai"
      - key: LLM_MODEL
        value: "gemini-1.5-flash"
      - key: EMBEDDING_MODEL
        value: "text-embedding-004"
      - key: LLM_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ML_SERVICE_URL
        fromService:
          name: carbon-iq-ml-service
          type: web
          property: host
      - key: WEB_ORIGIN
        sync: false

  # 2. Python FastAPI ML Service (Free Tier)
  - type: web
    name: carbon-iq-ml-service
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r apps/ml-service/requirements.txt
    startCommand: cd apps/ml-service && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
